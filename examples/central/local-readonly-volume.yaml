server:
  mode: "core"

deployment:
  profile: "central"
  transport: "streamable_http"
  fixed_analysis_tier: true

auth:
  required: true
  provider: "trusted_headers"
  trusted_principal_header: "x-auth-principal"
  trusted_tenant_header: "x-auth-tenant"
  trusted_roles_header: "x-auth-roles"
  trusted_scopes_header: "x-auth-scopes"
  trusted_proxy_networks:
    - "10.0.0.0/24"

policy:
  default_tool_action: "deny"
  allow_tools:
    - get_server_info
    - list_files
    - inspect_file
    - validate_file
    - list_branches
    - read_branches
    - get_branch_stats
  deny_tools:
    - switch_mode
    - export_data
    - run_root_code
    - run_rdataframe
    - run_root_macro
  require_named_resources: true
  disable_local_absolute_paths: false
  allow_central_absolute_paths: false

http:
  host: "0.0.0.0"
  port: 8000
  endpoint: "/mcp"
  origin_allowlist:
    - "https://analysis.example.org"
  require_origin_header: true
  allow_public_bind: true

resources:
  - name: "mounted_data"
    uri: "file:///data/root"
    description: "Read-only local data volume"
    allowed_patterns:
      - "*.root"
    excluded_patterns:
      - "private/**"
    allowed_roles:
      - "analysis-reader"
    allowed_principals: []
    allow_listing: true
    allow_read: true
    allow_export: false

security:
  allowed_roots:
    - "/data/root"
  allow_remote: false
  allowed_protocols:
    - "file"

quotas:
  max_concurrent_requests_per_principal: 1
  max_concurrent_requests_per_tenant: 5
  max_request_seconds: 60
  max_rows_per_call: 250000
  max_output_bytes_per_call: 10000000

output:
  export_base_path: "/srv/root-mcp/exports"
  allowed_formats:
    - "json"
    - "csv"
  retention_days: 7
  max_total_bytes: 10000000000

features:
  enable_export: false
  enable_root: false

root_native:
  execution_backend: "disabled"
