server:
  mode: "extended"

deployment:
  profile: "central"
  transport: "streamable_http"
  fixed_analysis_tier: true

auth:
  required: true
  provider: "trusted_headers"
  trusted_principal_header: "x-auth-principal"
  trusted_tenant_header: "x-auth-tenant"
  trusted_roles_header: "x-auth-roles"
  trusted_scopes_header: "x-auth-scopes"
  trusted_proxy_networks:
    - "127.0.0.0/8"
    - "::1/128"

policy:
  default_tool_action: "deny"
  allow_tools:
    - get_server_info
    - list_files
    - inspect_file
    - validate_file
    - list_branches
    - read_branches
    - get_branch_stats
    - compute_histogram
    - compute_histogram_2d
    - plot_histogram_1d
    - plot_histogram_2d
    - export_data
  deny_tools:
    - switch_mode
    - run_root_code
    - run_rdataframe
    - run_root_macro
  require_named_resources: true
  disable_local_absolute_paths: false
  allow_central_absolute_paths: false

http:
  host: "127.0.0.1"
  port: 8000
  endpoint: "/mcp"
  origin_allowlist:
    - "https://analysis.example.org"
  require_origin_header: true
  allow_public_bind: false

resources:
  - name: "run3"
    uri: "file:///data/root"
    description: "Read-only mounted ROOT files"
    allowed_patterns:
      - "*.root"
    excluded_patterns: []
    allowed_roles:
      - "analysis-reader"
    allowed_principals: []
    allow_listing: true
    allow_read: true
    allow_export: false

security:
  allowed_roots:
    - "/data/root"
  allow_remote: false
  allowed_protocols:
    - "file"

quotas:
  max_concurrent_requests_per_principal: 2
  max_concurrent_requests_per_tenant: 10
  max_request_seconds: 120
  max_rows_per_call: 1000000
  max_output_bytes_per_call: 50000000

audit:
  sink: "both"
  jsonl_path: "/var/log/root-mcp/audit.jsonl"

output:
  export_base_path: "/srv/root-mcp/exports"
  allowed_formats:
    - "json"
    - "csv"
    - "parquet"
  retention_days: 14
  max_total_bytes: 50000000000

features:
  enable_export: true
  enable_root: false

root_native:
  execution_backend: "disabled"
